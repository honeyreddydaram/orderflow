name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Docker is preinstalled on GitHub-hosted ubuntu runners, which is what Testcontainers
      # needs for the integration tests added from Milestone 2 onward.
      - name: Build and test (Maven reactor)
        run: mvn -B verify
